name: Build JpgFindRaw (English) Windows EXE

on:
  push:
    branches:
      - '**'
    tags:
      - 'en*'
    paths:
      - 'jpg-find-raw-en/**'
      - '.github/workflows/build-jpgfindraw-win.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: jpg-find-raw-en

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller>=6.11,<7"
          python -c "import tkinter; print('Tk', tkinter.Tcl().eval('info patchlevel'))"

      - name: Build single-file EXE
        run: |
          pyinstaller --noconfirm --clean JpgFindRaw_win.spec
          ls -la dist/

      - name: Self-test packaged EXE
        run: |
          T="$RUNNER_TEMP/jfrtest"
          rm -rf "$T"
          python tests/make_testdata.py "$T"
          JFR_SELFTEST_DIR="$(cygpath -w "$T")" ./dist/JpgFindRaw.exe &
          for i in $(seq 1 120); do [ -f "$T/result.json" ] && break; sleep 1; done
          taskkill //IM JpgFindRaw.exe //F 2>/dev/null || true
          python tests/make_testdata.py check "$T/result.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JpgFindRaw-Windows-exe
          path: jpg-find-raw-en/dist/JpgFindRaw.exe
          retention-days: 30

      - name: Publish EXE to 'exe-build' branch (easy download)
        if: github.ref_type == 'branch'
        run: |
          rm -rf "$RUNNER_TEMP/pub" && mkdir "$RUNNER_TEMP/pub"
          cp dist/JpgFindRaw.exe "$RUNNER_TEMP/pub/"
          cd "$RUNNER_TEMP/pub"
          git init -q -b exe-build
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          echo "Built from ${GITHUB_SHA} (${GITHUB_REF_NAME})" > BUILD_INFO.txt
          git add . && git commit -q -m "JpgFindRaw EXE from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" exe-build

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: jpg-find-raw-en/dist/JpgFindRaw.exe
