name: Build JPG查找RAW (中文版) macOS DMG

on:
  push:
    branches:
      - '**'
    paths:
      - 'jpg-find-raw-zh/**'
      - '.github/workflows/build-jpgfindraw-zh-mac.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PY_VERSION: '3.13.7'

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: jpg-find-raw-zh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install python.org universal2 Python
        run: |
          curl -fsSL -o /tmp/python.pkg "https://www.python.org/ftp/python/${PY_VERSION}/python-${PY_VERSION}-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          PY="/Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13"
          "$PY" -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install "pyinstaller>=6.11,<7"

      - name: Build .app (universal2, onedir)
        run: |
          /tmp/venv/bin/pyinstaller --noconfirm --clean JpgFindRaw_zh.spec
          ls dist/
          lipo -archs "dist/JPG查找RAW.app/Contents/MacOS/JpgFindRawCN"
          codesign --verify --deep --verbose=2 "dist/JPG查找RAW.app"

      - name: Self-test packaged app
        run: |
          T=$(mktemp -d)
          python3 ../jpg-find-raw-en/tests/make_testdata.py "$T"
          JFR_SELFTEST_DIR="$T" "./dist/JPG查找RAW.app/Contents/MacOS/JpgFindRawCN" &
          PID=$!
          for i in $(seq 1 90); do [ -f "$T/result.json" ] && break; sleep 1; done
          kill $PID 2>/dev/null || true
          python3 ../jpg-find-raw-en/tests/make_testdata.py check "$T/result.json"

      - name: Launch like Finder on a Chinese-language system (must not crash, no Tk console)
        run: |
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "dist/JPG查找RAW.app/Contents/Info.plist" | LC_ALL=C grep -qv '[^ -~]' && echo "CFBundleName is ASCII"
          defaults write -g AppleLanguages -array zh-Hans en
          defaults write -g AppleLocale zh_CN
          T=$(mktemp -d)
          python3 ../jpg-find-raw-en/tests/make_testdata.py "$T"
          open --env JFR_SELFTEST_DIR="$T" "dist/JPG查找RAW.app"
          for i in $(seq 1 90); do [ -f "$T/result.json" ] && break; sleep 1; done
          pkill -f JpgFindRawCN || true
          defaults delete -g AppleLanguages 2>/dev/null || true
          defaults delete -g AppleLocale 2>/dev/null || true
          python3 ../jpg-find-raw-en/tests/make_testdata.py check "$T/result.json"
          python3 -c "import json,sys; r=json.load(open('$T/result.json')); print('tk_console =', r.get('tk_console')); sys.exit(1 if r.get('tk_console') is not False else 0)"

      - name: Screenshot of the running app (real macOS rendering)
        continue-on-error: true
        run: |
          D=$(mktemp -d); python3 ../jpg-find-raw-en/tests/make_testdata.py "$D"
          JFR_PREFILL_DIR="$D" "./dist/JPG查找RAW.app/Contents/MacOS/JpgFindRawCN" &
          PID=$!
          sleep 8
          screencapture -x /tmp/zh_screenshot.png || true
          kill $PID 2>/dev/null || true
          ls -la /tmp/zh_screenshot.png || true

      - name: Create DMG
        run: |
          rm -rf dmgroot && mkdir dmgroot
          cp -R "dist/JPG查找RAW.app" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "JPG查找RAW" -srcfolder dmgroot -ov -format UDZO JPG查找RAW_Installer.dmg
          ls -la JPG查找RAW_Installer.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JPG查找RAW-macOS-dmg
          path: jpg-find-raw-zh/JPG查找RAW_Installer.dmg
          retention-days: 30

      - name: Publish DMG to 'dmg-build-zh' branch (easy download)
        if: github.ref_type == 'branch'
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub
          cp JPG查找RAW_Installer.dmg /tmp/pub/
          cp /tmp/zh_screenshot.png /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub
          git init -q -b dmg-build-zh
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          echo "Built from ${GITHUB_SHA} (${GITHUB_REF_NAME})" > BUILD_INFO.txt
          git add . && git commit -q -m "JPG查找RAW DMG from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" dmg-build-zh
