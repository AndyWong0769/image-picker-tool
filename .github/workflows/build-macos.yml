name: Build macOS DMG

on:
  push:
    tags:
      - 'v*'  # 推送 v* 标签时触发
  workflow_dispatch:  # 也支持手动触发

# 给 GITHUB_TOKEN 写权限，允许 Create Release
permissions:
  contents: write

jobs:
  build:
    # Apple Silicon runner (macos-13 Intel 已于2025年12月退役)
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (x86_64 for Rosetta cross-compile)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'  # x86_64 Python，兼容所有 Mac + 虚拟机

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          arch -x86_64 pip install py2app pillow

      - name: Build macOS app (x86_64, min macOS 10.15 Catalina)
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: |
          arch -x86_64 python setup.py py2app

      - name: Create DMG
        run: |
          cd dist
          hdiutil create -volname "拼版挑片" -srcfolder "拼版挑片.app" -ov -format UDZO ../拼版挑片.dmg
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 拼版挑片-macos
          path: 拼版挑片.dmg
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: 拼版挑片.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
