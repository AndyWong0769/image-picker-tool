name: Build JPG查找RAW (中文版) Windows EXE

on:
  push:
    branches: ['**']
    paths:
      - 'jpg-find-raw-zh/**'
      - '.github/workflows/build-jpgfindraw-zh-win.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: jpg-find-raw-zh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Install PyInstaller
        run: pip install "pyinstaller>=6.11,<7"
      - name: Build EXE
        run: pyinstaller --noconfirm --clean JpgFindRaw_zh_win.spec && ls -la dist
      - name: Self-test packaged EXE
        run: |
          T="$RUNNER_TEMP/jfrtest"; rm -rf "$T"
          python ../jpg-find-raw-en/tests/make_testdata.py "$T"
          JFR_SELFTEST_DIR="$(cygpath -w "$T")" "./dist/JPG查找RAW.exe" &
          for i in $(seq 1 90); do [ -f "$T/result.json" ] && break; sleep 1; done
          taskkill //IM "JPG查找RAW.exe" //F 2>/dev/null || true
          python ../jpg-find-raw-en/tests/make_testdata.py check "$T/result.json"
      - name: Self-test packaged EXE (picked images)
        run: |
          T="$RUNNER_TEMP/jfrtest2"; rm -rf "$T"
          python ../jpg-find-raw-en/tests/make_testdata.py "$T"
          JFR_SELFTEST_PICK=1 JFR_SELFTEST_DIR="$(cygpath -w "$T")" "./dist/JPG查找RAW.exe" &
          for i in $(seq 1 90); do [ -f "$T/result.json" ] && break; sleep 1; done
          taskkill //IM "JPG查找RAW.exe" //F 2>/dev/null || true
          python ../jpg-find-raw-en/tests/make_testdata.py check "$T/result.json"
      - name: Screenshot
        continue-on-error: true
        shell: pwsh
        run: |
          python ..\jpg-find-raw-en\tests\make_testdata.py "$env:RUNNER_TEMP\jfr_demo"
          $env:JFR_PREFILL_DIR = "$env:RUNNER_TEMP\jfr_demo"
          Start-Process ".\dist\JPG查找RAW.exe"
          Start-Sleep -Seconds 10
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\zh_windows.png")
          Get-Process | Where-Object { $_.Path -like "*JPG*RAW.exe" } | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Publish to 'exe-build-zh' branch
        if: github.ref_type == 'branch'
        run: |
          P="$RUNNER_TEMP/pub"; rm -rf "$P"; mkdir "$P"
          cp "dist/JPG查找RAW.exe" "$P/"
          cp "$RUNNER_TEMP/zh_windows.png" "$P/" 2>/dev/null || true
          cd "$P"
          git init -q -b exe-build-zh
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git config core.quotepath false
          echo "Built from ${GITHUB_SHA}" > BUILD_INFO.txt
          git add . && git commit -q -m "JPG查找RAW EXE ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" exe-build-zh
